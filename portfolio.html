<style>
/* Layout: one bordered terminal window fills the screen. Output scrolls, quick-command chips sit under it, and a regular GUI view swaps in on request. Single dark look by choice. */
:root {
  --bg: #0d100c;
  --term: #11150f;
  --fg: #d9decf;
  --dim: #7f8977;
  --rule: #263122;
  --green: #6fd08c;
  --amber: #e8b95a;
  --cyan: #79c3d3;
  --red: #e27d6a;
  --edge: #2f9e57;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  box-sizing: border-box;
  padding-inline: 16px;
  padding-block: 12px;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
a { color: var(--cyan); }

.win {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--term);
  border: 1px solid var(--edge);
  border-radius: 4px;
}
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--rule);
  font-size: 12px;
  color: var(--dim);
}
.bar b { font-weight: 500; color: var(--fg); }
.btn {
  background: none;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 3px 9px;
  color: var(--cyan);
  cursor: pointer;
  font-size: 12px;
}
.btn:hover { border-color: var(--cyan); }

.scroller {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 14px 12px;
  font-size: 14px;
  line-height: 1.55;
}
.line { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.gap { height: 0.8em; }
.ind { padding-left: 4ch; }
.b { padding-left: 2ch; text-indent: -2ch; }
.grid2 { display: grid; grid-template-columns: 14ch minmax(0, 1fr); column-gap: 2ch; white-space: normal; }
.dim { color: var(--dim); }
.g { color: var(--green); }
.amber { color: var(--amber); }
.err { color: var(--red); }
.u { color: var(--amber); font-weight: 600; }
.at { color: var(--green); }
.host { color: var(--green); font-weight: 600; }
.cmd { color: var(--cyan); cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.cmd:hover { text-decoration-color: currentColor; }

.art {
  margin: 4px 0 2px;
  font-family: var(--mono);
  font-size: clamp(11px, 3.6vw, 22px);
  line-height: 1;
  color: var(--green);
  white-space: pre;
  overflow-x: auto;
}
.art .sh { color: var(--dim); }

.row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 1ch; padding-block: 2px; }
.row:focus-within { box-shadow: inset 2px 0 0 var(--amber); padding-left: 8px; margin-left: -8px; }
.prompt { white-space: nowrap; }
#cmd {
  flex: 1;
  min-width: 10ch;
  background: none;
  border: 0;
  outline: 0;
  padding: 0;
  color: var(--fg);
  font: inherit;
  caret-color: var(--amber);
}
@media (pointer: coarse) { #cmd { font-size: 16px; } }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 9px 14px;
  border-top: 1px dashed var(--rule);
}
.chip {
  background: none;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 3px 9px;
  font-size: 12px;
  color: var(--cyan);
  cursor: pointer;
}
.chip:hover { border-color: var(--cyan); }

/* GUI view */
.gui { flex: 1; min-height: 0; overflow-y: auto; font-family: var(--sans); font-size: 16px; line-height: 1.6; }
.gwrap {
  max-width: 860px;
  margin-inline: auto;
  padding: 28px clamp(16px, 4vw, 32px) 56px;
  display: flex;
  flex-direction: column;
  gap: 38px;
}
.ghead { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.gwrap h1 { font-family: var(--mono); font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0; font-weight: 600; color: var(--green); text-wrap: balance; }
.gwrap .role { margin: 0; color: var(--dim); font-family: var(--mono); font-size: 13px; }
.gwrap .lead { margin: 4px 0 0; max-width: 62ch; }
.glinks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-family: var(--mono); font-size: 13px; margin-top: 6px; }
.gwrap section { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.gwrap h2 {
  margin: 0;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  font: 600 12px/1 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--amber);
}
.proj { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.proj .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 16px; }
.proj h3 { margin: 0; font-size: 18px; font-weight: 600; }
.proj .date { font: 12px var(--mono); color: var(--dim); }
.proj .sub { margin: 0; color: var(--dim); }
.proj ul { margin: 4px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.tags span { font: 12px var(--mono); border: 1px solid var(--rule); border-radius: 3px; padding: 2px 7px; color: var(--dim); }
.skills { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: 10px 20px; margin: 0; }
.skills dt { font: 500 13px/1.7 var(--mono); color: var(--green); }
.skills dd { margin: 0; }
.edu { display: flex; flex-direction: column; gap: 2px; }
.edu .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; }
.edu .top b { font-weight: 600; }
.plain { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.gcols { display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 600px) {
  .skills { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .skills dd { margin-bottom: 12px; }
}
</style>

  };
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  var scroller = $('#scroller');
  var log = $('#log');

  function print(html, cls) {

  function gap() { print('', 'gap'); }

  function echo(text) {

  }

  // ---- Banner ---------------------------------------------------------------

    }
    if (log.contains(e)) {
      var below = scroller.scrollHeight - e.offsetTop;
      scroller.scrollTop = below > scroller.clientHeight ? e.offsetTop - 8 : scroller.scrollHeight;
    } else {
      scroller.scrollTop = 0;
    }
  }

  // ---- Modes ----------------------------------------------------------------
  function setMode(m) {
    $('#termwin').hidden = m === 'gui';
    $('#guiwin').hidden = m !== 'gui';
    if (m === 'gui') { $('#gui').scrollTop = 0; }
    else if (fine) { input.focus(); }
  }

  // ---- GUI view -------------------------------------------------------------
  function buildGui() {
    var h = '';
    h += '<div class="gwrap">';
    h += '<header class="ghead"><h1>' + esc(D.name) + '</h1>';
    h += '<p class="role">' + esc(D.role + ' · ' + D.school) + '</p>';
    h += '<p class="lead">' + esc(D.summary.join(' ')) + '</p>';
    h += '<div class="glinks"><span><span class="addr">' + esc(D.email) + '</span> ' + copyBtn(D.email) + '</span>' +
      ext(D.github, 'GitHub') + ext(D.linkedin, 'LinkedIn') + ext(D.resumeUrl, 'Resume') + '</div></header>';

    h += '<section><h2>Projects</h2>';
    D.projects.forEach(function (p) {
      h += '<article class="proj"><div class="top"><h3>' + esc(p.name) + '</h3><span class="date">' + esc(p.date) + '</span></div>';
      h += '<p class="sub">' + esc(p.sub) + '</p>';
      h += '<div class="tags">' + p.stack.map(function (s) { return '<span>' + esc(s) + '</span>'; }).join('') + '</div>';
      h += '<ul>' + p.pts.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
      h += '<div>' + ext(p.link, 'View code') + '</div></article>';
    });
    h += '</section>';

    h += '<section><h2>Technical skills</h2><dl class="skills">';
    D.skills.forEach(function (s) { h += '<dt>' + esc(s[0]) + '</dt><dd>' + esc(s[1]) + '</dd>'; });
    h += '<dt>Key courses</dt><dd>' + esc(D.courses) + '</dd></dl></section>';

    h += '<section><h2>Education</h2>';
    D.education.forEach(function (e) {
      h += '<div class="edu"><div class="top"><b>' + esc(e.deg) + '</b><span class="date" style="font:12px var(--mono);color:var(--dim)">' + esc(e.year) + '</span></div>';
      h += '<span>' + esc(e.where) + ' · ' + esc(e.score) + '</span></div>';
    });
    h += '</section>';

    h += '<section><h2>Achievements</h2><ul class="plain">';
    D.achievements.forEach(function (a) { h += '<li><b>' + esc(a[0]) + '.</b> ' + esc(a[1]) + '</li>'; });
    h += '</ul></section>';

    h += '</div>';
    $('#gui').innerHTML = h;
  }

  // ---- Copy -----------------------------------------------------------------
  function doCopy(el) {
    var text = el.getAttribute('data-copy');
    var original = '[copy]';
    function done(msg) {
      el.textContent = msg;
      setTimeout(function () { el.textContent = original; }, 1600);
    }
    function fallback() {
      var scope = el.parentElement;
      var addr = scope && scope.querySelector('.addr');
      if (addr && window.getSelection) {
        var r = document.createRange();
        r.selectNodeContents(addr);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
      done('[selected]');
    }
    try {
      navigator.clipboard.writeText(text).then(function () { done('[copied]'); }, fallback);
    } catch (err) {
      fallback();
    }
  }

  // ---- Events ---------------------------------------------------------------
  function activate(el) {
    if (el.hasAttribute('data-copy')) { doCopy(el); return; }
    var c = el.getAttribute('data-cmd');
    if (c) { run(c); if (fine) input.focus(); }
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-cmd],[data-copy]');
    if (el) activate(el);
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('span[data-cmd],span[data-copy]')) {
      e.preventDefault();
      activate(e.target);
    }
  });
  scroller.addEventListener('click', function (e) {
    if (e.target.closest('a,.cmd,button,input')) return;
    if (String(window.getSelection())) return;
    if (fine) input.focus();
  });
  $('#toGui').addEventListener('click', function () { setMode('gui'); });
  $('#toTerm').addEventListener('click', function () { setMode('term'); });

  $('#row').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = '';
    run(v);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (hi > 0) { hi--; input.value = hist[hi]; }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (hi < hist.length - 1) { hi++; input.value = hist[hi]; }
      else { hi = hist.length; input.value = ''; }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      var v = input.value.trim().toLowerCase();
      if (!v) return;
      var names = Object.keys(C).concat(Object.keys(ALIAS).filter(function (k) { return k.length > 2; }));
      var hits = names.filter(function (n) { return n.indexOf(v) === 0; });
      if (hits.length === 1) { input.value = hits[0] + ' '; }
      else if (hits.length > 1) { echo(input.value); print(hits.map(function (n) { return cmdLink(n); }).join('  ')); }
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
      e.preventDefault();
      C.clear();
    }
  });

  // ---- Start ----------------------------------------------------------------
  buildGui();
  run('banner', false);
  scroller.scrollTop = 0;
  if (fine) input.focus({ preventScroll: true });
})();
</script>

</body></html>
