<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neeraj Kumar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one bordered terminal window fills the screen. Output scrolls, quick-command chips sit under it, and a regular GUI view swaps in on request. Single dark look by choice. */
:root {
  --bg: #0d100c;
  --term: #11150f;
  --fg: #d9decf;
  --dim: #7f8977;
  --rule: #263122;
  --green: #6fd08c;
  --amber: #e8b95a;
  --cyan: #79c3d3;
  --red: #e27d6a;
  --edge: #2f9e57;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  box-sizing: border-box;
  padding-inline: 16px;
  padding-block: 12px;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
a { color: var(--cyan); }

.win {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--term);
  border: 1px solid var(--edge);
  border-radius: 4px;
}
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--rule);
  font-size: 12px;
  color: var(--dim);
}
.bar b { font-weight: 500; color: var(--fg); }
.btn {
  background: none;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 3px 9px;
  color: var(--cyan);
  cursor: pointer;
  font-size: 12px;
}
.btn:hover { border-color: var(--cyan); }

.scroller {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 14px 12px;
  font-size: 14px;
  line-height: 1.55;
}
.line { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.gap { height: 0.8em; }
.ind { padding-left: 4ch; }
.b { padding-left: 2ch; text-indent: -2ch; }
.grid2 { display: grid; grid-template-columns: 14ch minmax(0, 1fr); column-gap: 2ch; white-space: normal; }
.dim { color: var(--dim); }
.g { color: var(--green); }
.amber { color: var(--amber); }
.err { color: var(--red); }
.u { color: var(--amber); font-weight: 600; }
.at { color: var(--green); }
.host { color: var(--green); font-weight: 600; }
.cmd { color: var(--cyan); cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.cmd:hover { text-decoration-color: currentColor; }

.art {
  margin: 4px 0 2px;
  font-family: var(--mono);
  font-size: clamp(11px, 3.6vw, 22px);
  line-height: 1;
  color: var(--green);
  white-space: pre;
  overflow-x: auto;
}
.art .sh { color: var(--dim); }

.row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 1ch; padding-block: 2px; }
.row:focus-within { box-shadow: inset 2px 0 0 var(--amber); padding-left: 8px; margin-left: -8px; }
.prompt { white-space: nowrap; }
#cmd {
  flex: 1;
  min-width: 10ch;
  background: none;
  border: 0;
  outline: 0;
  padding: 0;
  color: var(--fg);
  font: inherit;
  caret-color: var(--amber);
}
@media (pointer: coarse) { #cmd { font-size: 16px; } }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 9px 14px;
  border-top: 1px dashed var(--rule);
}
.chip {
  background: none;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 3px 9px;
  font-size: 12px;
  color: var(--cyan);
  cursor: pointer;
}
.chip:hover { border-color: var(--cyan); }

/* GUI view: profile layout. Sticky sidebar (photo, nav) beside modular sections on desktop; stacked with a sticky chip nav on phones. */
.gui {
  --card: #151a12;
  --card2: #1b2217;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
}
.gshell {
  max-width: 1100px;
  margin-inline: auto;
  padding: clamp(16px, 3vw, 32px) clamp(16px, 4vw, 32px) 64px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
@media (min-width: 860px) {
  .gshell { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 44px; align-items: start; }
}

/* Sidebar */
.gside { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
@media (min-width: 860px) {
  .gside { position: sticky; top: 24px; max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 2px; }
}
.gid { display: flex; gap: 16px; align-items: center; }
@media (min-width: 860px) { .gid { flex-direction: column; align-items: stretch; gap: 18px; } }
.photo { margin: 0; position: relative; flex: none; width: 92px; }
@media (min-width: 860px) { .photo { width: 100%; } }
.photo img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid var(--edge);
  box-shadow: 5px 5px 0 var(--rule);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.photo:hover img { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--rule); }
.photo figcaption {
  display: none;
  position: absolute;
  left: 8px;
  bottom: 8px;
  font: 11px var(--mono);
  background: var(--bg);
  color: var(--green);
  padding: 1px 6px;
  border-radius: 3px;
}
@media (min-width: 860px) { .photo figcaption { display: block; } }
.gname { min-width: 0; }
.gname h1 { margin: 0; font: 600 clamp(22px, 3vw, 26px) / 1.15 var(--mono); color: var(--green); text-wrap: balance; }
.gname .role { margin: 4px 0 0; font: 12px / 1.5 var(--mono); color: var(--dim); }
.open {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0 0;
  font: 12px var(--mono);
  color: var(--fg);
  border: 1px solid var(--rule);
  border-radius: 99px;
  padding: 3px 11px 3px 9px;
}
.dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 var(--green);
  animation: ping 2.4s infinite;
}
@keyframes ping {
  70% { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .dot { animation: none; }
  .photo img { transition: none; }
}

/* Navigation */
.gnavb {
  background: none;
  border: 0;
  text-align: left;
  font: 13px var(--mono);
  color: var(--dim);
  cursor: pointer;
}
.gnavb:hover { color: var(--fg); }
.gnavb[aria-current="true"] { color: var(--green); }
.gnav-d { display: none; }
@media (min-width: 860px) {
  .gnav-d { display: flex; flex-direction: column; }
  .gnav-d .gnavb { padding: 6px 12px; border-left: 2px solid var(--rule); }
  .gnav-d .gnavb[aria-current="true"] { border-left-color: var(--green); }
  .gnav-m { display: none !important; }
}
.gnav-m {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-block: 8px;
  background: var(--term);
}
.gnav-m .gnavb { border: 1px solid var(--rule); border-radius: 99px; padding: 4px 13px; white-space: nowrap; }
.gnav-m .gnavb[aria-current="true"] { border-color: var(--green); }
.gcontact { display: none; }
@media (min-width: 860px) {
  .gcontact { display: flex; flex-direction: column; gap: 6px; font: 13px / 1.5 var(--mono); min-width: 0; overflow-wrap: anywhere; }
}

/* Sections */
.gmain { display: flex; flex-direction: column; gap: 46px; min-width: 0; }
.gsec { display: flex; flex-direction: column; gap: 16px; min-width: 0; scroll-margin-top: 56px; }
.gsec > h2 {
  margin: 0;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  font: 600 12px / 1 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--amber);
}
.hero {
  --mx: 80%;
  --my: 0%;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: clamp(18px, 4vw, 32px);
  background: radial-gradient(circle at var(--mx) var(--my), color-mix(in srgb, var(--green) 14%, transparent), transparent 42%), var(--card);
  border: 1px solid var(--rule);
  border-radius: 12px;
}
.eyebrow { margin: 0; font: 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.big { margin: 0; font-size: clamp(28px, 4.6vw, 46px); line-height: 1.1; font-weight: 600; text-wrap: balance; }
.big em { font-style: normal; color: var(--green); }
.lead { margin: 0; max-width: 58ch; color: var(--dim); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 6px; }
.tile {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  padding: 12px 14px;
  background: var(--card2);
  border: 1px solid var(--rule);
  border-radius: 8px;
  color: var(--fg);
  cursor: pointer;
}
.tile:hover { border-color: var(--dim); }
.tile[aria-pressed="true"] { border-color: var(--green); }
.tile b { font: 600 26px / 1.1 var(--mono); color: var(--amber); }
.tile span { font-size: 13px; color: var(--dim); }
.tiledetail { margin: 0; min-height: 3.4em; max-width: 62ch; font-size: 15px; }
.tiledetail b { font-weight: 600; color: var(--green); }

/* Projects */
.fbar { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip {
  background: none;
  border: 1px solid var(--rule);
  border-radius: 99px;
  padding: 3px 12px;
  font: 12px var(--mono);
  color: var(--cyan);
  cursor: pointer;
}
.fchip:hover { border-color: var(--cyan); }
.fchip[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: #0d100c; }
.fcount { margin: 0; font: 12px var(--mono); color: var(--dim); }
.pc { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.pc[data-open="true"] { border-color: var(--edge); }
.pc-head {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 12px;
  padding: 16px 18px;
  text-align: left;
  background: none;
  border: 0;
  color: var(--fg);
  cursor: pointer;
}
.pc-head:hover { background: var(--card2); }
.pc-top { grid-area: 1 / 1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.pc-name { font-size: 19px; font-weight: 600; }
.pc-date { font: 12px var(--mono); color: var(--dim); }
.pc-caret { grid-area: 1 / 2; font: 20px / 1 var(--mono); color: var(--green); }
.pc-caret::before { content: "+"; }
.pc-head[aria-expanded="true"] .pc-caret::before { content: "\2212"; }
.pc-sub { grid-area: 2 / 1 / 3 / 3; font-size: 15px; color: var(--dim); }
.pc-meta { grid-area: 3 / 1 / 4 / 3; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.pc-metric { font: 600 12px var(--mono); color: #0d100c; background: var(--green); border-radius: 3px; padding: 2px 7px; }
.tag { font: 12px var(--mono); border: 1px solid var(--rule); border-radius: 3px; padding: 2px 7px; color: var(--dim); }
.pc-body { display: flex; flex-direction: column; gap: 14px; padding: 0 18px 18px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fn {
  background: var(--card2);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 11px;
  font: 13px var(--mono);
  color: var(--fg);
  cursor: pointer;
}
.fn i { font-style: normal; color: var(--dim); margin-right: 6px; }
.fn:hover { border-color: var(--dim); }
.fn[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
.arr { font: 13px var(--mono); color: var(--dim); }
.flowdetail { margin: 0; padding: 10px 12px; min-height: 3.2em; font-size: 15px; background: var(--card2); border: 1px dashed var(--rule); border-radius: 6px; }
.flowdetail::before { content: "\203A "; color: var(--green); font-family: var(--mono); }
.pts { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }

/* Skills */
.hint { margin: 0; font-size: 14px; color: var(--dim); max-width: 62ch; }
.sgs { display: flex; flex-direction: column; gap: 16px; }
.sg { display: flex; flex-direction: column; gap: 8px; }
.sg h3 { margin: 0; font: 500 12px var(--mono); letter-spacing: 0.06em; color: var(--green); }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.sk { font: 13px var(--mono); background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; color: var(--fg); }
button.sk { cursor: pointer; }
button.sk:hover { border-color: var(--cyan); }
.sk i { font-style: normal; font-size: 11px; color: var(--green); margin-left: 6px; }
.sk.off { color: var(--dim); }

/* Path */
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tli { position: relative; margin-left: 6px; padding-left: 24px; border-left: 1px solid var(--rule); }
.tli:last-child { border-left-color: transparent; }
.tli::before {
  content: "";
  position: absolute;
  left: -5px;
  top: 15px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--term);
  border: 1px solid var(--dim);
}
.tli[data-open="true"]::before { background: var(--green); border-color: var(--green); }
.tl-head {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 14px;
  padding: 8px 0;
  text-align: left;
  background: none;
  border: 0;
  color: var(--fg);
  cursor: pointer;
}
.tl-head:hover .tl-title { color: var(--green); }
.tl-when { min-width: 7.5em; font: 12px var(--mono); color: var(--amber); }
.tl-title { font-weight: 600; }
.tl-body { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; font-size: 15px; color: var(--dim); }
.tl-body p { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* Contact */
.cta { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: clamp(18px, 4vw, 28px); background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
.ctalead { margin: 0; max-width: 52ch; }
.bigmail { margin: 0; font: 500 clamp(15px, 3.4vw, 24px) / 1.35 var(--mono); overflow-wrap: anywhere; }
.glinks2 { display: flex; flex-wrap: wrap; gap: 6px 20px; font: 14px var(--mono); }

/* ---- GUI extras ---- */
.prog { height: 2px; background: var(--rule); }
.prog i { display: block; height: 100%; width: 100%; background: var(--green); transform: scaleX(0); transform-origin: left; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.caret { margin-left: 2px; color: var(--green); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } .fprog i { transition: none; } }
.tile b em { font-style: normal; }

.gtools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.kbtn {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 7px 10px;
  font: 13px var(--mono);
  color: var(--dim);
  cursor: pointer;
}
.kbtn:hover { border-color: var(--dim); color: var(--fg); }
.kbtn kbd { font: 11px var(--mono); border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; color: var(--dim); }
@media (min-width: 860px) {
  .gtools { flex-direction: column; align-items: stretch; gap: 14px; }
  .kbtn { display: inline-flex; }
}
.acc { display: flex; align-items: center; gap: 9px; }
.acc::before { content: "accent"; font: 11px var(--mono); color: var(--dim); margin-right: 2px; }
.swatch { width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; background: var(--sw); cursor: pointer; }
.swatch[data-acc="green"] { --sw: #6fd08c; }
.swatch[data-acc="amber"] { --sw: #e8b95a; }
.swatch[data-acc="cyan"] { --sw: #79c3d3; }
.swatch[data-acc="coral"] { --sw: #e58a74; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--term), 0 0 0 4px var(--fg); }

.flowbar { display: flex; align-items: center; gap: 12px; }
.fprog { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.fprog i { display: block; height: 100%; width: 0; background: var(--green); transition: width 0.5s ease; }
.btn.play { color: var(--green); }

.skq, .cf input, .cf textarea {
  box-sizing: border-box;
  width: 100%;
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--fg);
}
.skq { max-width: 420px; font: 14px var(--mono); }
.skq:focus, .cf input:focus, .cf textarea:focus { border-color: var(--cyan); }
@media (pointer: coarse) { .skq { font-size: 16px; } }

.compose { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
.cf { display: flex; flex-direction: column; gap: 4px; }
.cf label { font: 12px var(--mono); color: var(--dim); }
.cf input, .cf textarea { background: var(--card2); font: 16px var(--sans); resize: vertical; }
.crow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font: 13px var(--mono); }
.dim2 { color: var(--dim); }
.cpre { margin: 0; padding: 10px 12px; max-width: 100%; overflow-x: auto; white-space: pre-wrap; background: var(--card2); border: 1px dashed var(--rule); border-radius: 6px; font: 13px / 1.5 var(--mono); }

.pal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 12vh 16px 16px;
  background: rgba(8, 10, 7, 0.72);
}
.palbox {
  width: 100%;
  max-width: 560px;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
}
#palq {
  box-sizing: border-box;
  width: 100%;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  padding: 14px 16px;
  color: var(--fg);
  font: 16px var(--mono);
  outline: none;
}
#pall { list-style: none; margin: 0; padding: 6px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.pl { border-radius: 6px; }
.pl.on { background: var(--card2); box-shadow: inset 2px 0 0 var(--green); }
.po {
  display: flex;
  width: 100%;
  box-sizing: border-box;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 8px 12px;
  background: none;
  border: 0;
  color: var(--fg);
  font: 14px var(--sans);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}
.po span { min-width: 0; overflow-wrap: anywhere; }
.po em { font-style: normal; font-size: 13px; color: var(--dim); margin-left: 8px; }
.po small { font: 11px var(--mono); color: var(--dim); white-space: nowrap; }
.palhint { margin: 0; padding: 8px 14px; border-top: 1px dashed var(--rule); font: 11px var(--mono); color: var(--dim); }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  max-width: calc(100% - 32px);
  padding: 7px 14px;
  background: var(--green);
  color: #0d100c;
  border-radius: 6px;
  font: 13px var(--mono);
}
.pc-body { padding-bottom: 14px; }
.pc-links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 0 18px 16px; font: 14px var(--mono); }
.demo { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border: 1px solid var(--green); border-radius: 4px; color: var(--green); text-decoration: none; }
.demo:hover { background: var(--green); color: #0d100c; }
.backrow { display: flex; }
.hp { display: none; }
</style>

<div class="win" id="termwin">
  <div class="bar">
    <span><b>neeraj</b> · terminal</span>
    <button class="btn" type="button" id="toGui">gui view</button>
  </div>
  <div class="scroller" id="scroller">
    <div id="log" role="log" aria-live="polite"></div>
    <form class="row" id="row" autocomplete="off">
      <label class="prompt" for="cmd"><span class="u">guest</span><span class="at">@</span><span class="host">neeraj</span><span class="dim">:~$</span></label>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Terminal command">
    </form>
  </div>
  <div class="chips" aria-label="Quick commands">
    <button class="chip" type="button" data-cmd="help">help</button>
    <button class="chip" type="button" data-cmd="about">about</button>
    <button class="chip" type="button" data-cmd="projects">projects</button>
    <button class="chip" type="button" data-cmd="skills">skills</button>
    <button class="chip" type="button" data-cmd="education">education</button>
    <button class="chip" type="button" data-cmd="resume">resume</button>
    <button class="chip" type="button" data-cmd="contact">contact</button>
    <button class="chip" type="button" data-cmd="clear">clear</button>
  </div>
</div>

<div class="win" id="guiwin" hidden>
  <div class="bar">
    <span><b>neeraj</b> · website</span>
    <button class="btn" type="button" id="toTerm">terminal view</button>
  </div>
  <div class="prog" aria-hidden="true"><i id="progbar"></i></div>
  <div class="gui" id="gui"></div>
</div>

  // ---- Content (edit links here) -------------------------------------------

  // ---- Helpers --------------------------------------------------------------
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  };
  var cmdLink = function (run, label) {
    return '<span class="cmd" role="button" tabindex="0" data-cmd="' + esc(run) + '">' + esc(label || run) + '</span>';
  };
  var ext = function (url, label) {
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(label || url) + '</a>';
  };
  var copyBtn = function (text) {
    return '<span class="cmd" role="button" tabindex="0" data-copy="' + esc(text) + '">[copy]</span>';
  };
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  var scroller = $('#scroller');
  var log = $('#log');
  var input = $('#cmd');

  function print(html, cls) {
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    log.appendChild(d);
    return d;
  }
  function gap() { print('', 'gap'); }
  function heading(t) { print('<span class="amber">## ' + esc(t) + '</span>'); }
  function echo(text) {
    return print('<span class="u">guest</span><span class="at">@</span><span class="host">neeraj</span><span class="dim">:~$</span> ' + esc(text));
  }

  // ---- Banner ---------------------------------------------------------------
  var GLYPH = {
    N: ['█   █', '██  █', '█ █ █', '█  ██', '█   █'],
    E: ['█████', '█    ', '████ ', '█    ', '█████'],
    R: ['████ ', '█   █', '████ ', '█  █ ', '█   █'],
    A: [' ███ ', '█   █', '█████', '█   █', '█   █'],
    J: ['  ███', '    █', '    █', '█   █', ' ███ ']
  };
  function bannerArt() {
    var word = 'NEERAJ'.split('');
    var rows = [0, 1, 2, 3, 4].map(function (r) {
      return word.map(function (ch) { return GLYPH[ch][r]; }).join(' ');
    });
    var shadow = word.map(function (ch) { return GLYPH[ch][4].replace(/█/g, '░'); }).join(' ');
    return rows.join('\n') + '\n<span class="sh">' + shadow + '</span>';
  }

  // ---- Printers -------------------------------------------------------------
  function pSummary() {
    D.summary.forEach(function (l) { print(esc(l)); });
  }
  function pProjectList() {
    D.projects.forEach(function (p) {
      print(cmdLink('project ' + p.id, '[' + p.id + ']') + ' <b class="g">' + esc(p.name) + '</b> <span class="dim">' + esc(p.date) + '</span>');
      print(esc(p.sub), 'ind');
      print(esc(p.stack.join(' · ')), 'ind dim');
      gap();
    });
    print('Type ' + cmdLink('project 1') + ' (or 2, 3) to read the details.');
  }
  function pProject(p) {
    print('<b class="g">' + esc(p.name) + '</b> <span class="dim">' + esc(p.date) + '</span>');
    print(esc(p.sub));
    print('<span class="dim">stack: ' + esc(p.stack.join(' · ')) + '</span>');
    gap();
    p.pts.forEach(function (t) { print('– ' + esc(t), 'b'); });
    gap();
    if (p.demo) print('live demo: ' + ext(p.demo));
    print('code: ' + ext(p.link));
  }
  function pSkills() {
    D.skills.forEach(function (s) {
      print('<span class="amber">' + esc(s[0]) + '</span>');
      print(esc(s[1]), 'ind');
      gap();
    });
    print('<span class="amber">Key courses</span>');
    print(esc(D.courses), 'ind');
  }
  function pEducation() {
    D.education.forEach(function (e, i) {
      print('<b class="g">' + esc(e.deg) + '</b> <span class="dim">' + esc(e.year) + '</span>');
      print(esc(e.where + ' · ' + e.score), 'ind');
      if (i < D.education.length - 1) gap();
    });
  }
  function pAchievements() {
    D.achievements.forEach(function (a, i) {
      print('<b class="g">' + esc(a[0]) + '</b>');
      print(esc(a[1]), 'ind');
      if (i < D.achievements.length - 1) gap();
    });
  }
  function pContact() {
    print('<span class="dim">email</span>    <span class="addr">' + esc(D.email) + '</span> ' + copyBtn(D.email));
    print('<span class="dim">github</span>   ' + ext(D.github));
    print('<span class="dim">linkedin</span> ' + ext(D.linkedin));
    print('<span class="dim">leetcode</span> ' + ext(D.leetcode));
  }
  function pIntro() {
    print('<pre class="art" aria-label="NEERAJ">' + bannerArt() + '</pre>', 'art-wrap');
    gap();
    print('<b>#' + esc(D.name) + '</b>');
    gap();
    pSummary();
    gap();
    print('Want a regular website? type ' + cmdLink('gui') + ' and press enter');
    gap();
    print('Example commands:');
    [['resume', 'r', 'resume'], ['projects', 'p', 'projects'], ['skills', 's', 'skills'], ['education', 'e', 'education'], ['email', '', 'email'], ['github', '', 'github']]

        var lbl = x[1] ? cmdLink(x[0]) + ' or ' + cmdLink(x[1]) : cmdLink(x[0]);
        print('– ' + lbl, 'ind');

    gap();
    print('Type ' + cmdLink('help') + ' to see every command.');

    ['contact', 'contact', 'every way to reach me'],
    ['gui', 'gui', 'switch to the regular website'],
    ['clear', 'clear', 'clear the screen']

    help: function () {
      print('Available commands:');
      HELP.forEach(function (h) {
        print('<span>' + cmdLink(h[0], h[1]) + '</span><span class="dim">' + esc(h[2]) + '</span>', 'grid2');

      gap();
      print('<span class="dim">Short forms: a, p, s, e, r. Use ↑ and ↓ for history, Tab to complete.</span>');
    },
    banner: function () { pIntro(); },
    about: function () {
      print('<b class="g">' + esc(D.name) + '</b>');
      print(esc(D.role + ', ' + D.school + ' (2024 to present).'));
      gap();
      pSummary();
    },
    projects: function () { pProjectList(); },
    project: function (args) {
      var q = (args[0] || '').toLowerCase();
      var p = D.projects.filter(function (x) {
        return String(x.id) === q || x.key.indexOf(q) === 0 || (q && x.name.toLowerCase().indexOf(q) === 0);
      })[0];
      if (!p) {
        print('<span class="err">usage:</span> project &lt;n&gt;, for example ' + cmdLink('project 1') + '. See ' + cmdLink('projects') + ' for the list.');
        return;
      }
      pProject(p);
    },
    skills: function () { pSkills(); },
    education: function () { pEducation(); },
    achievements: function () { pAchievements(); },

      heading('Contact'); pContact();

      if (args.join(' ').toLowerCase().indexOf('hire') !== -1) {
        print('<span class="g">Permission granted.</span> Drafting the offer letter. The fastest way to send it: ' + cmdLink('email') + '.');
      } else {
        print('<span class="err">guest is not in the sudoers file.</span> This incident will be reported.');
      }
    }
  };
  var ALIAS = { a: 'about', p: 'projects', s: 'skills', e: 'education', r: 'resume', cls: 'clear', '?': 'help', man: 'help', mail: 'email', gh: 'github', li: 'linkedin', lc: 'leetcode' };

  var hist = [];
  var hi = 0;

  function run(raw, record) {
    var line = String(raw).trim();
    var e = echo(line);
    if (line) {
      if (record !== false) { hist.push(line); hi = hist.length; }
      var parts = line.split(/\s+/);
      var name = parts[0].toLowerCase();
      var fn = C[ALIAS[name] || name];
      if (typeof fn === 'function' && Object.prototype.hasOwnProperty.call(C, ALIAS[name] || name)) {
        fn(parts.slice(1));
      } else {
        print('<span class="err">command not found:</span> ' + esc(parts[0]) + '. Type ' + cmdLink('help') + ' to list commands.');
      }
    }
    if (log.contains(e)) {
      var below = scroller.scrollHeight - e.offsetTop;
      scroller.scrollTop = below > scroller.clientHeight ? e.offsetTop - 8 : scroller.scrollHeight;
    } else {
      scroller.scrollTop = 0;
    }
  }

  // ---- Modes ----------------------------------------------------------------
  function setMode(m) {
    $('#termwin').hidden = m === 'gui';
    $('#guiwin').hidden = m !== 'gui';
    if (m === 'gui') { $('#gui').scrollTop = 0; guiShown(); }
    else if (fine) { input.focus(); }
  }

  function toks(s) { return String(s).toLowerCase().split('/'); }
  function matches(p, f) {
    if (!f) return true;

  function cardHtml(p) {
    var x = X[p.id];
    var s = '<article class="pc" data-id="' + p.id + '" data-open="false">';
    s += '<button class="pc-head" type="button" data-pc="' + p.id + '" aria-expanded="false" aria-controls="pcb-' + p.id + '">';
    s += '<span class="pc-top"><span class="pc-name">' + esc(p.name) + '</span><span class="pc-date">' + esc(p.date) + '</span></span>';
    s += '<span class="pc-caret" aria-hidden="true"></span>';
    s += '<span class="pc-sub">' + esc(p.sub) + '</span>';
    s += '<span class="pc-meta"><span class="pc-metric">' + esc(x.metric) + '</span>' +

    s += '<div class="flow" role="group" aria-label="' + esc(p.name) + ' pipeline">';
    s += x.flow.map(function (f, i) {
      return (i ? '<span class="arr" aria-hidden="true">→</span>' : '') +

  function updateProjects() {
    var shown = 0;
    D.projects.forEach(function (p) {
      var el = g.querySelector('.pc[data-id="' + p.id + '"]');
      var m = matches(p, st.flt);
      el.hidden = !m;

      el.setAttribute('data-open', open);

      el.querySelector('.pc-body').hidden = !open;
      var k = st.node[p.id];
      el.querySelectorAll('.fn').forEach(function (b, i) { b.setAttribute('aria-pressed', i === k); });
      el.querySelector('.flowdetail').textContent = X[p.id].flow[k][1];

  function stopFlow(id) {
    if (timers[id]) { clearInterval(timers[id]); delete timers[id]; }
  }
  function playFlow(id) {
    stopFlow(id);
    st.open[id] = true;
    st.node[id] = 0;
    timers[id] = setInterval(function () {
      if (st.node[id] >= X[id].flow.length - 1) { stopFlow(id); updateProjects(); return; }
      st.node[id]++;
      updateProjects();
    }, 1600);
    updateProjects();
  }

  function countUp(el) {
    if (!el) return;
    var to = +el.getAttribute('data-to');
    if (reduced() || !window.requestAnimationFrame) { el.textContent = to; return; }
    var t0 = null;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / 900);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) window.requestAnimationFrame(frame);
    }
    el.textContent = 0;
    window.requestAnimationFrame(frame);
  }
  function guiShown() {
    if (!g) return;
    g.querySelectorAll('.cu').forEach(function (el) { countUp(el); });
    spy();
  }

  function toast(msg) {
    var t = $('#toast');

  function copyText(text, okMsg) {
    function ok() { toast(okMsg || 'Copied'); }

  function renderPal() {

    palList = palItems().filter(function (it) {

  function startTyping() {
    var el = g.querySelector('#typed');
    if (!el || reduced()) return;
    var pi = 0, ci = PHR[0].length, dir = -1;
    function tick() {
      if ($('#guiwin').hidden) { setTimeout(tick, 600); return; }
      var d;
      if (dir < 0) {
        ci--;
        if (ci <= 0) { ci = 0; dir = 1; pi = (pi + 1) % PHR.length; d = 320; } else { d = 35; }
      } else {
        ci++;
        if (ci >= PHR[pi].length) { ci = PHR[pi].length; dir = -1; d = 2400; } else { d = 70; }
      }
      el.textContent = PHR[pi].slice(0, ci);
      setTimeout(tick, d);
    }
    setTimeout(tick, 2600);

  function wireExtras() {
    var win = $('#guiwin');

      '<p class="palhint">Up and down to move, Enter to select, Esc to close</p></div></div>' +
      '<div class="toast" id="toast" role="status" hidden></div>');

    var pal = $('#pal');
    var palq = $('#palq');
    pal.addEventListener('click', function (e) { if (e.target === pal) closePal(); });
    pal.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); closePal(); }
      else if (e.key === 'Tab') { e.preventDefault(); }

    palq.addEventListener('input', function () { palIdx = 0; renderPal(); });

      if (!palList.length) return;

      else if (e.key === 'ArrowUp') { e.preventDefault(); palIdx = (palIdx - 1 + palList.length) % palList.length; renderPal(); }

    function draft() {
      var n = cn.value.trim(), m = cm.value.trim(), em = ce.value.trim();
      return 'Hi Neeraj,\n\n' + (m || 'I found your portfolio and would like to talk.') + (n ? '\n\n' + n : '') + (em ? '\n' + em : '');
    }
    function sync() {
      cl.href = 'mailto:' + D.email + '?subject=' + encodeURIComponent('Hello from your portfolio') + '&body=' + encodeURIComponent(draft());
    }
    [cn, ce, cm].forEach(function (el) { el.addEventListener('input', sync); });
    sync();
    function copyDraft() {
      var d = draft();
      function okc() { cp.hidden = true; cs.textContent = 'Draft copied. Paste it into an email to ' + D.email + '.'; }
      function failc() {
        cp.hidden = false;
        cp.textContent = d;
        var r = document.createRange();
        r.selectNodeContents(cp);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);

      }

    }
    function sendMsg() {
      var m = cm.value.trim();
      if (!m) { cs.textContent = 'Write a message first.'; cm.focus(); return; }
      if (cb.checked) { return; }
      cc.disabled = true;

        return fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            access_key: CONTACT.key,
            subject: 'Portfolio message from ' + (cn.value.trim() || 'a visitor'),
            name: cn.value.trim(),
            email: ce.value.trim(),
            message: m,
            botcheck: cb.checked
          })
        });
      }).then(function (r) {
        return r.json().catch(function () { return {}; });
      }).then(function (j) {
        if (j && j.success) {
          cs.textContent = 'Message sent. Thank you, I will reply soon.';
          cm.value = '';
          sync();
        } else {
          throw new Error('send failed');
        }
      }).catch(function () {
        cs.textContent = 'The message could not be sent. Use Copy as draft and email ' + D.email + ' instead.';
      }).then(function () { cc.disabled = false; });

    if (cd) cd.addEventListener('click', copyDraft);

      ph.firstElementChild.style.transform = 'perspective(700px) rotateY(' + (x * 10) + 'deg) rotateX(' + (-y * 10) + 'deg) translate(-2px,-2px)';
    });
    ph.addEventListener('pointerleave', function () { ph.firstElementChild.style.transform = ''; });

    startTyping();
    spy();

  // ---- Copy -----------------------------------------------------------------
  function doCopy(el) {
    var text = el.getAttribute('data-copy');
    var original = '[copy]';
    function done(msg) {
      el.textContent = msg;
      setTimeout(function () { el.textContent = original; }, 1600);
    }
    function fallback() {
      var scope = el.parentElement;
      var addr = scope && scope.querySelector('.addr');
      if (addr && window.getSelection) {
        var r = document.createRange();
        r.selectNodeContents(addr);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
      done('[selected]');
    }
    try {
      navigator.clipboard.writeText(text).then(function () { done('[copied]'); }, fallback);
    } catch (err) {
      fallback();
    }
  }

  // ---- Events ---------------------------------------------------------------
  function activate(el) {
    if (el.hasAttribute('data-copy')) { doCopy(el); return; }
    var c = el.getAttribute('data-cmd');
    if (c) { run(c); if (fine) input.focus(); }
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-cmd],[data-copy]');
    if (el) activate(el);
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('span[data-cmd],span[data-copy]')) {
      e.preventDefault();
      activate(e.target);
    }
  });
  scroller.addEventListener('click', function (e) {
    if (e.target.closest('a,.cmd,button,input')) return;
    if (String(window.getSelection())) return;
    if (fine) input.focus();
  });
  $('#toGui').addEventListener('click', function () { setMode('gui'); });
  $('#toTerm').addEventListener('click', function () { setMode('term'); });

  $('#row').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = '';
    run(v);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (hi > 0) { hi--; input.value = hist[hi]; }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (hi < hist.length - 1) { hi++; input.value = hist[hi]; }
      else { hi = hist.length; input.value = ''; }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      var v = input.value.trim().toLowerCase();
      if (!v) return;
      var names = Object.keys(C).concat(Object.keys(ALIAS).filter(function (k) { return k.length > 2; }));
      var hits = names.filter(function (n) { return n.indexOf(v) === 0; });
      if (hits.length === 1) { input.value = hits[0] + ' '; }
      else if (hits.length > 1) { echo(input.value); print(hits.map(function (n) { return cmdLink(n); }).join('  ')); }
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
      e.preventDefault();
      C.clear();
    }
  });

  // ---- Start ----------------------------------------------------------------
  buildGui();
  run('banner', false);
  scroller.scrollTop = 0;
  if (fine) input.focus({ preventScroll: true });
})();
</script>

</body></html>
